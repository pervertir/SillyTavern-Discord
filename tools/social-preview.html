<!doctype html>
<!-- The repository's social preview (1280×640): the name on the left, the phone in the middle and the
     looks cascading on the right. node tools/social-preview.mjs takes the shots and renders it to
     docs/social-preview.png. -->
<html>
<head>
<meta charset="utf-8">
<style>
    html, body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .card {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background:
            radial-gradient(circle at 12% 30%, rgba(88, 101, 242, 0.55) 0, rgba(88, 101, 242, 0) 45%),
            radial-gradient(circle at 85% 90%, rgba(235, 69, 158, 0.28) 0, rgba(235, 69, 158, 0) 40%),
            linear-gradient(135deg, #1e1f3b 0%, #121318 100%);
        color: #ffffff;
    }

    /* left: the name */
    .text {
        position: absolute;
        left: 64px;
        top: 0;
        bottom: 0;
        width: 380px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 26px;
    }
    h1 {
        margin: 0 0 18px;
        font-size: 50px;
        font-weight: 800;
        line-height: 1.04;
        letter-spacing: -0.5px;
    }
    p {
        margin: 0;
        font-size: 21px;
        line-height: 1.42;
        color: rgba(255, 255, 255, 0.82);
    }

    /* middle: the phone */
    .phone {
        position: absolute;
        left: 470px;
        top: 50%;
        width: 246px;
        height: 532px;
        transform: translateY(-50%);
        padding: 9px;
        box-sizing: border-box;
        border-radius: 40px;
        background: #0b0b0e;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), 0 0 0 1.5px rgba(255, 255, 255, 0.14);
        z-index: 10;
    }
    .phone img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        border-radius: 31px;
    }

    /* right: the looks */
    .stack {
        position: absolute;
        left: 752px;
        top: 70px;
        width: 470px;
        height: 500px;
    }
    .look {
        position: absolute;
        width: 360px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.14);
        transform: rotate(-3deg);
    }
    .look img {
        display: block;
        width: 100%;
    }
    .look span {
        position: absolute;
        right: 10px;
        top: 9px;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2px;
    }
</style>
</head>
<body>
<div class="card">
    <div class="text">
        <svg class="logo" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
        <h1>SillyTavern Discord Theme</h1>
        <p>Your characters, in Discord. Servers, DMs, typing dots and every settings page, on desktop and phone.</p>
    </div>

    <div class="phone"><img src="../docs/screenshots/raw/preview/phone.png" alt=""></div>

    <div class="stack">
        <div class="look" style="left: 0; top: 0"><img src="../docs/screenshots/raw/preview/light.png" alt=""><span>Light</span></div>
        <div class="look" style="left: 22px; top: 52px"><img src="../docs/screenshots/raw/preview/ash.png" alt=""><span>Ash</span></div>
        <div class="look" style="left: 44px; top: 104px"><img src="../docs/screenshots/raw/preview/dark.png" alt=""><span>Dark</span></div>
        <div class="look" style="left: 66px; top: 156px"><img src="../docs/screenshots/raw/preview/onyx.png" alt=""><span>Onyx</span></div>
        <div class="look" style="left: 88px; top: 208px"><img src="../docs/screenshots/raw/preview/aurora.png" alt=""><span>Aurora</span></div>
        <div class="look" style="left: 110px; top: 260px"><img src="../docs/screenshots/raw/preview/chroma-glow.png" alt=""><span>Chroma Glow</span></div>
    </div>
</div>
</body>
</html>
