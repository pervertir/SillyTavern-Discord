<div class="dsc-settings-panel">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Discord Theme</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="dsc_enabled">
                <input id="dsc_enabled" type="checkbox" />
                <span>Enable theme</span>
            </label>

            <div class="dsc-setting-row">
                <label for="dsc_appearance">Appearance</label>
                <select id="dsc_appearance" class="text_pole">
                    <option value="dark">Dark</option>
                    <option value="ash">Ash</option>
                    <option value="onyx">Onyx</option>
                    <option value="light">Light</option>
                    <option value="system">Sync with computer</option>
                </select>
            </div>

            <div class="dsc-setting-row">
                <label for="dsc_nitro">Color theme (Nitro)</label>
                <select id="dsc_nitro" class="text_pole">
                    <option value="">None</option>
                </select>
            </div>

            <div class="dsc-setting-row">
                <label for="dsc_message_display">Message display</label>
                <select id="dsc_message_display" class="text_pole">
                    <option value="cozy">Cozy</option>
                    <option value="compact">Compact</option>
                </select>
            </div>

            <label class="checkbox_label" for="dsc_aside">
                <input id="dsc_aside" type="checkbox" />
                <span>Show the profile panel and member list</span>
            </label>

            <label class="checkbox_label" for="dsc_presence">
                <input id="dsc_presence" type="checkbox" />
                <span>Show characters as online</span>
            </label>

            <label class="checkbox_label" for="dsc_show_bg">
                <input id="dsc_show_bg" type="checkbox" />
                <span>Show the chat background image behind messages</span>
            </label>

            <label class="checkbox_label" for="dsc_split">
                <input id="dsc_split" type="checkbox" />
                <span>Split replies into short messages</span>
            </label>

            <label class="checkbox_label" for="dsc_presence_sim">
                <input id="dsc_presence_sim" type="checkbox" />
                <span>Characters go online, idle and offline; someone away comes online before replying</span>
            </label>

            <div class="dsc-setting-row">
                <label for="dsc_wake_delay">Seconds to come online</label>
                <input id="dsc_wake_delay" class="text_pole" type="number" min="0" max="30" step="1" />
            </div>

            <label class="checkbox_label" for="dsc_desktop_notifications">
                <input id="dsc_desktop_notifications" type="checkbox" />
                <span>Desktop notifications for replies while you're away</span>
            </label>

            <h4>Sounds</h4>
            <label class="checkbox_label" for="dsc_sounds">
                <input id="dsc_sounds" type="checkbox" />
                <span>Play sounds</span>
            </label>
            <div class="dsc-setting-row">
                <label for="dsc_sound_volume">Volume</label>
                <input id="dsc_sound_volume" type="range" min="0" max="100" step="5" />
            </div>
            <label class="checkbox_label" for="dsc_sound_message">
                <input id="dsc_sound_message" type="checkbox" />
                <span>Message (when the window isn't in front)</span>
            </label>
            <label class="checkbox_label" for="dsc_sound_always">
                <input id="dsc_sound_always" type="checkbox" />
                <span>Ping for every reply, even in the open chat</span>
            </label>
            <label class="checkbox_label" for="dsc_sound_online">
                <input id="dsc_sound_online" type="checkbox" />
                <span>Someone comes online</span>
            </label>
            <label class="checkbox_label" for="dsc_sound_voice">
                <input id="dsc_sound_voice" type="checkbox" />
                <span>Mute and deafen</span>
            </label>

            <label class="checkbox_label" for="dsc_times">
                <input id="dsc_times" type="checkbox" />
                <span>Discord-style message times</span>
            </label>

            <div class="dsc-setting-row">
                <label for="dsc_recent_max">Conversations in the list</label>
                <input id="dsc_recent_max" class="text_pole" type="number" min="5" max="500" step="5" />
            </div>

            <small class="dsc-note">Turn off other UI themes (such as Moonlit Echoes, Yodayo Tavern or Microsoft Teams) while this one is on. The chat background image is hidden unless you turn it on above.</small>
        </div>
    </div>
</div>
